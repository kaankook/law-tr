<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Seti Görüntüleyici - Türk Hukuk RAG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #4a90a4;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            color: #4fc3f7;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #90caf9;
            font-size: 1.1em;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(79, 195, 247, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #4fc3f7;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #4fc3f7;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #90caf9;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .file-input-wrapper {
            position: relative;
        }
        
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        
        .file-btn, .nav-btn, select {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .file-btn {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #1a1a2e;
            font-weight: bold;
        }
        
        .file-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 195, 247, 0.4);
        }
        
        .nav-btn {
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
            border: 1px solid #4fc3f7;
        }
        
        .nav-btn:hover {
            background: rgba(79, 195, 247, 0.3);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        select {
            background: #16213e;
            color: #e0e0e0;
            border: 1px solid #4a90a4;
            min-width: 200px;
        }
        
        .question-counter {
            margin-left: auto;
            font-size: 1.2em;
            color: #4fc3f7;
        }
        
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(79, 195, 247, 0.3);
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .question-id {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .badge-difficulty {
            background: #2e7d32;
        }
        
        .badge-difficulty.orta {
            background: #f57c00;
        }
        
        .badge-difficulty.zor {
            background: #c62828;
        }
        
        .badge-type {
            background: #5e35b1;
        }
        
        .badge-source {
            background: #00695c;
        }
        
        .section {
            margin-bottom: 25px;
        }
        
        .section-title {
            color: #4fc3f7;
            font-size: 1.1em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #4fc3f7;
            border-radius: 2px;
        }
        
        .question-text {
            font-size: 1.4em;
            color: #ffffff;
            line-height: 1.5;
            padding: 15px;
            background: rgba(79, 195, 247, 0.1);
            border-radius: 10px;
            border-left: 4px solid #4fc3f7;
        }
        
        .answer-box {
            background: rgba(46, 125, 50, 0.15);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4caf50;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        .source-quote {
            background: rgba(255, 193, 7, 0.15);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
            font-style: italic;
        }
        
        .alternatives {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .alternative-item {
            background: rgba(103, 58, 183, 0.15);
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #7c4dff;
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tag {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .tag-must {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #ef9a9a;
        }
        
        .tag-should {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #fff59d;
        }
        
        .tag-entity {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196f3;
            color: #90caf9;
        }
        
        .source-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .detail-item {
            background: rgba(0, 150, 136, 0.15);
            padding: 15px;
            border-radius: 8px;
        }
        
        .detail-label {
            color: #80cbc4;
            font-size: 0.85em;
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: #ffffff;
            font-weight: 500;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #90caf9;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            fill: #4fc3f7;
        }
        
        .keyboard-hint {
            text-align: center;
            color: #607d8b;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .keyboard-hint kbd {
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #607d8b;
        }
        
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .question-counter {
                margin-left: 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Veri Seti Görüntüleyici</h1>
            <p class="subtitle">Türk Hukuk RAG Sistemi Test Veri Seti</p>
        </header>
        
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-value" id="totalQuestions">-</div>
                <div class="stat-label">Toplam Soru</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="easyCount">-</div>
                <div class="stat-label">Kolay</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="mediumCount">-</div>
                <div class="stat-label">Orta</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="hardCount">-</div>
                <div class="stat-label">Zor</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="file-input-wrapper">
                <label class="file-btn" for="fileInput">📁 JSON Dosyası Seç</label>
                <input type="file" id="fileInput" accept=".json">
            </div>
            
            <select id="datasetSelect">
                <option value="">Hazır Veri Seti Seç...</option>
                <option value="bronze">Bronze Dataset</option>
                <option value="silver">Silver Dataset</option>
                <option value="golden">Golden Dataset</option>
            </select>
            
            <button class="nav-btn" id="prevBtn" disabled>◀ Önceki</button>
            <button class="nav-btn" id="nextBtn" disabled>Sonraki ▶</button>
            
            <select id="questionSelect" style="flex-grow: 1;">
                <option value="">Soru seçin...</option>
            </select>
            
            <span class="question-counter" id="questionCounter">0 / 0</span>
        </div>
        
        <div id="content">
            <div class="empty-state">
                <svg viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20M9,13V19H7V13H9M15,15V19H17V15H15M11,11V19H13V11H11Z"/></svg>
                <h2>Veri Seti Yüklenmedi</h2>
                <p>Yukarıdan bir JSON dosyası seçin veya hazır veri setlerinden birini seçin</p>
            </div>
        </div>
        
        <div class="keyboard-hint">
            Klavye kısayolları: <kbd>←</kbd> Önceki | <kbd>→</kbd> Sonraki | <kbd>Home</kbd> İlk | <kbd>End</kbd> Son
        </div>
    </div>

    <script>
        let dataset = null;
        let currentIndex = 0;
        
        const fileInput = document.getElementById('fileInput');
        const datasetSelect = document.getElementById('datasetSelect');
        const questionSelect = document.getElementById('questionSelect');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const content = document.getElementById('content');
        const questionCounter = document.getElementById('questionCounter');
        
        // Hazır veri seti yolları
        const datasetPaths = {
            bronze: '../data/test_datasets/bronze_dataset_final.json',
            silver: '../data/test_datasets/silver_dataset_final.json',
            golden: '../data/test_datasets/golden_dataset_final.json'
        };
        
        // Dosya yükleme
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        dataset = JSON.parse(event.target.result);
                        initializeViewer();
                    } catch (err) {
                        alert('JSON dosyası okunamadı: ' + err.message);
                    }
                };
                reader.readAsText(file);
            }
        });
        
        // Hazır veri seti seçimi
        datasetSelect.addEventListener('change', async (e) => {
            const selected = e.target.value;
            if (selected && datasetPaths[selected]) {
                try {
                    const response = await fetch(datasetPaths[selected]);
                    dataset = await response.json();
                    initializeViewer();
                } catch (err) {
                    alert('Veri seti yüklenemedi. Dosyanın mevcut olduğundan emin olun.\n\nHata: ' + err.message);
                }
            }
        });
        
        // Soru seçimi
        questionSelect.addEventListener('change', (e) => {
            const idx = parseInt(e.target.value);
            if (!isNaN(idx)) {
                currentIndex = idx;
                renderQuestion();
            }
        });
        
        // Navigasyon butonları
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (dataset && currentIndex < dataset.questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        });
        
        // Klavye kısayolları
        document.addEventListener('keydown', (e) => {
            if (!dataset) return;
            
            if (e.key === 'ArrowLeft') {
                prevBtn.click();
            } else if (e.key === 'ArrowRight') {
                nextBtn.click();
            } else if (e.key === 'Home') {
                currentIndex = 0;
                renderQuestion();
            } else if (e.key === 'End') {
                currentIndex = dataset.questions.length - 1;
                renderQuestion();
            }
        });
        
        function initializeViewer() {
            if (!dataset || !dataset.questions) {
                alert('Geçersiz veri seti formatı');
                return;
            }
            
            // İstatistikleri güncelle
            const questions = dataset.questions;
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('easyCount').textContent = questions.filter(q => q.difficulty === 'kolay').length;
            document.getElementById('mediumCount').textContent = questions.filter(q => q.difficulty === 'orta').length;
            document.getElementById('hardCount').textContent = questions.filter(q => q.difficulty === 'zor').length;
            
            // Soru dropdown'ını doldur
            questionSelect.innerHTML = '<option value="">Soru seçin...</option>';
            questions.forEach((q, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `#${q.id}: ${q.question.substring(0, 60)}...`;
                questionSelect.appendChild(option);
            });
            
            currentIndex = 0;
            renderQuestion();
        }
        
        function renderQuestion() {
            if (!dataset || !dataset.questions.length) return;
            
            const q = dataset.questions[currentIndex];
            const total = dataset.questions.length;
            
            // Navigasyon güncelle
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === total - 1;
            questionSelect.value = currentIndex;
            questionCounter.textContent = `${currentIndex + 1} / ${total}`;
            
            // Zorluk badge rengi
            const difficultyClass = q.difficulty === 'orta' ? 'orta' : q.difficulty === 'zor' ? 'zor' : '';
            
            // Must include ve should include
            const mustInclude = q.evaluation_criteria?.must_include || q.answer?.key_entities || [];
            const shouldInclude = q.evaluation_criteria?.should_include || [];
            
            content.innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-id">Soru #${q.id}</span>
                        <div class="badges">
                            <span class="badge badge-difficulty ${difficultyClass}">${q.difficulty || 'Belirsiz'}</span>
                            <span class="badge badge-type">${q.question_type || 'Genel'}</span>
                            <span class="badge badge-source">${q.source || 'Kaynak yok'}</span>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">Soru</div>
                        <div class="question-text">${q.question}</div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">Beklenen Cevap</div>
                        <div class="answer-box">${q.answer?.main_answer || q.answer || 'Cevap yok'}</div>
                    </div>
                    
                    ${q.answer?.source_quote ? `
                    <div class="section">
                        <div class="section-title">Kaynak Alıntı</div>
                        <div class="source-quote">"${q.answer.source_quote}"</div>
                    </div>
                    ` : ''}
                    
                    ${q.alternative_correct_answers?.length ? `
                    <div class="section">
                        <div class="section-title">Alternatif Cevaplar</div>
                        <div class="alternatives">
                            ${q.alternative_correct_answers.map(alt => `
                                <div class="alternative-item">${alt}</div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="two-columns">
                        <div class="section">
                            <div class="section-title">Zorunlu Terimler (must_include)</div>
                            <div class="tags-container">
                                ${mustInclude.length ? mustInclude.map(tag => `
                                    <span class="tag tag-must">${tag}</span>
                                `).join('') : '<span style="color:#888">Belirtilmemiş</span>'}
                            </div>
                        </div>
                        
                        <div class="section">
                            <div class="section-title">Önerilen Terimler (should_include)</div>
                            <div class="tags-container">
                                ${shouldInclude.length ? shouldInclude.map(tag => `
                                    <span class="tag tag-should">${tag}</span>
                                `).join('') : '<span style="color:#888">Belirtilmemiş</span>'}
                            </div>
                        </div>
                    </div>
                    
                    ${q.answer?.key_entities?.length ? `
                    <div class="section">
                        <div class="section-title">Anahtar Kavramlar (key_entities)</div>
                        <div class="tags-container">
                            ${q.answer.key_entities.map(entity => `
                                <span class="tag tag-entity">${entity}</span>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="section">
                        <div class="section-title">Kaynak Detayları</div>
                        <div class="source-details">
                            <div class="detail-item">
                                <div class="detail-label">Doküman</div>
                                <div class="detail-value">${q.source_details?.document || q.source || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Madde</div>
                                <div class="detail-value">${q.source_details?.article || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Bölüm</div>
                                <div class="detail-value">${q.source_details?.section || '-'}</div>
                            </div>
                        </div>
                    </div>
                    
                    ${q.test_purpose ? `
                    <div class="section">
                        <div class="section-title">Test Amacı</div>
                        <div class="detail-item">
                            <div class="detail-value">${q.test_purpose}</div>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }
    </script>
</body>
</html>
